name: CI - Lint and Test

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint with flake8
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install flake8 flake8-docstrings flake8-quotes

    - name: Run flake8
      run: |
        flake8 tcping/ tests/ --count --statistics --show-source

    - name: Run flake8 with HTML report
      run: |
        flake8 tcping/ tests/ --format=html --htmldir=flake8-report
      continue-on-error: true

    - name: Upload flake8 report
      uses: actions/upload-artifact@v4
      with:
        name: flake8-report
        path: flake8-report/
      if: always()

  test:
    name: Run tests on Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest

    strategy:
      matrix:
        python-version: ['3.9', '3.10', '3.11', '3.12']
      fail-fast: false

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pytest-cov

    - name: Run tests with coverage
      run: |
        python -m pytest tests/ -v --cov=tcping --cov-report=xml --cov-report=html

    - name: Upload coverage report
      uses: actions/upload-artifact@v4
      with:
        name: coverage-report-python${{ matrix.python-version }}
        path: htmlcov/
      if: always()

    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v4
      with:
        file: ./coverage.xml
        fail_ci_if_error: false
        flags: python${{ matrix.python-version }}

  security:
    name: Security check with bandit
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install bandit
      run: pip install bandit

    - name: Run bandit security check
      run: bandit -r tcping/ -f json -o bandit-report.json || true

    - name: Upload bandit report
      uses: actions/upload-artifact@v4
      with:
        name: security-report
        path: bandit-report.json

  integration:
    name: Integration tests
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Test single target
      run: |
        python main.py google.com 80 --count 2

    - name: Test JSON output
      run: |
        python main.py google.com 80 --count 2 --json

    - name: Test with multiple targets
      run: |
        python main.py --targets google.com:80,github.com:443 --count 2

  done:
    name: All checks passed
    runs-on: ubuntu-latest
    needs: [lint, test, security, integration]
    if: always()

    steps:
    - name: Check results
      run: |
        echo "========================================="
        echo "CI pipeline completed"
        echo "========================================="

        echo ""
        echo "Job results:"
        echo "  Lint:          ${{ needs.lint.result }}"
        echo "  Test:          ${{ needs.test.result }}"
        echo "  Security:      ${{ needs.security.result }}"
        echo "  Integration:   ${{ needs.integration.result }}"

        echo ""

        if [[ "${{ needs.lint.result }}" != "success" ]]; then
          echo "Linter failed"
          exit 1
        fi

        if [[ "${{ needs.test.result }}" != "success" ]]; then
          echo "Tests failed"
          exit 1
        fi

        if [[ "${{ needs.integration.result }}" != "success" ]]; then
          echo "Integration tests failed"
          exit 1
        fi

        echo "All critical checks passed"

    - name: Upload all reports
      uses: actions/upload-artifact@v4
      with:
        name: all-reports
        path: |
          flake8-report/
          htmlcov/
          bandit-report.json
      if: always()
