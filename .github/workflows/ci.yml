name: CI - Lint and Test

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]

jobs:
  # Линтер (проверка стиля кода)
  lint:
    name: Lint with flake8
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install flake8 flake8-docstrings flake8-quotes

    - name: Run flake8
      run: |
        flake8 tcping/ tests/ --count --statistics --show-source

    - name: Run flake8 with HTML report (optional)
      run: |
        flake8 tcping/ tests/ --format=html --htmldir=flake8-report
      continue-on-error: true

    - name: Upload flake8 report
      uses: actions/upload-artifact@v4
      with:
        name: flake8-report
        path: flake8-report/
      if: always()

  # Тесты
  test:
    name: Run tests
    runs-on: ubuntu-latest
    needs: lint

    strategy:
      matrix:
        python-version: ['3.9', '3.10', '3.11', '3.12']

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pytest-cov

    - name: Run tests with coverage
      run: |
        python -m pytest tests/ -v --cov=tcping --cov-report=xml --cov-report=html

    - name: Upload coverage report
      uses: actions/upload-artifact@v4
      with:
        name: coverage-report-python${{ matrix.python-version }}
        path: htmlcov/
      if: always()

    - name: Upload coverage to Codecov (optional)
      uses: codecov/codecov-action@v4
      with:
        file: ./coverage.xml
        fail_ci_if_error: false

  # Безопасность (опционально)
  security:
    name: Security check
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install bandit
      run: pip install bandit

    - name: Run bandit security check
      run: bandit -r tcping/ -f json -o bandit-report.json || true

    - name: Upload bandit report
      uses: actions/upload-artifact@v4
      with:
        name: security-report
        path: bandit-report.json

  # Завершение (все проверки пройдены)
  done:
    name: All checks passed
    runs-on: ubuntu-latest
    needs: [lint, test, security]
    steps:
    - name: Success
      run: echo "✅ All checks passed!"